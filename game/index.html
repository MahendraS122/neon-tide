<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10232c">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/ui/hud.css">
  <link rel="stylesheet" href="./src/ui/titleScreen.css">
  <link rel="stylesheet" href="./src/ui/cityMap.css">
  <title>NEON TIDE · Port Solara</title>
</head>
<body>
  <canvas id="game" aria-label="Explore Port Solara on foot or by car"></canvas>
  <header id="identity"><b>NEON TIDE</b><span>PORT SOLARA / FREE ROAM</span></header>
  <section id="mission"><small id="chapter"></small><time id="timer"></time>
    <h1 id="mission-name"></h1><p id="objective"></p><div id="stage" class="meter"></div>
    <footer id="next"></footer></section>
  <section id="response" hidden><small>SPD RESPONSE</small><ul id="response-list"></ul></section>
  <aside id="wallet"><b id="cash"></b><span id="clock"></span>
    <div id="stars"></div><span id="wanted-label"></span></aside>
  <aside id="weapons" aria-label="Weapon slots"></aside><div id="reticle" hidden></div>
  <section id="failure" hidden><strong></strong><p>Returning to Ocean Drive</p></section>
  <section id="location"><canvas id="minimap" width="224" height="224" aria-label="Minimap"></canvas>
    <h2 id="district"></h2><div class="vitals">
      <span>HP <b id="health-value"></b></span><div id="health" class="meter"></div>
      <span>AR <b id="armour-value"></b></span><div id="armour" class="meter"></div>
      <span>RESPECT</span><div id="respect" class="meter"></div>
    </div></section>
  <section id="speedometer" hidden><div class="dial"><strong id="speed"></strong>
      <div><b id="gear"></b><span>KM/H</span></div></div>
    <h3 id="car-name"></h3><small id="condition"></small>
    <div class="nitro"><small>NITRO</small><div id="nitro" class="meter"></div></div>
    <div class="radio"><div id="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <small id="station"></small><p id="song"></p></div></section>
  <section id="dialogue" hidden><canvas id="portrait" width="56" height="56"></canvas>
    <div><small id="speaker"></small><p id="line"></p></div></section>
  <aside id="callout" hidden></aside><div id="hint"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
